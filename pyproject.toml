[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ketanai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mem0ai",
    "ollama",
    "rich",
    "chromadb",
]

[project.scripts]
ketanai = "ketanai.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ketanai*"]
